# 复制为 config.yaml 后填写真实信息，config.yaml 不要提交到公开仓库/分享给他人
#
# 机器指标全部来自青源 agent（见 metrics_agent 段和 QINGYUAN.zh-CN.md），在设置 → 部署里一键安装。

# Nightcord-Status（2702，自建监控服务）接入，跟青源机器并列展示成一张独立卡片。
# 它判定为故障的目标（ESXi、TCP、第三方 statuspage 等）会走下面的告警通知逐个报，恢复了发恢复通知。
# 两种接法：
#   source: push —— 推荐。2702 每轮采集完 POST 到 /api/status/report，请求头 X-Metrics-Secret
#                   填 metrics_agent.shared_secret。2702 主动连过来，它那边的防火墙不用开口子；
#                   超过 3 分钟没推送会单独报一条"2702 失联告警"。url 不用填。
#   source: pull —— 默认。Panopticon 去拉 2702 的 /api/status.json（xml_status_service.py，端口 8702）。
#                   该接口无鉴权，只信任 WireGuard 网段，url 填它在 WireGuard 网格里的内网地址。
nightcord_status:
  enabled: false
  name: "Nightcord-Status"
  source: pull
  url: "http://10.10.0.4:8702"      # 仅 pull：FreePBX（跑 xml_status_service.py 的机器）的 WireGuard 内网地址
  verify_ssl: false

# Dashboard 自身的登录保护（Panopticon 打算长期暴露公网时务必开启）
# 用法：
#   python gen_password_hash.py "你的密码"   # 生成 password_hash，粘到下面
# 也支持 Passkey（免密码，指纹/人脸/安全密钥）登录，密码登录始终保留作为备用方式；
# Passkey 在 /settings 页面里添加，不用手填这里，添加后会自动出现 passkeys 字段。
# 注意：Passkey 需要通过 HTTPS 访问（127.0.0.1/localhost 除外），纯 WireGuard 内网 HTTP 访问用不了。
dashboard_auth:
  enabled: false                # 只在 WireGuard 内网访问、不打算公网暴露时可以设 false
  username: "mizuki"
  password_hash: "用 gen_password_hash.py 生成，不要直接写明文密码"
  max_attempts: 5                # 同一 IP 连续失败这么多次后锁定
  lockout_seconds: 900           # 锁定时长（秒），默认 15 分钟
  # 经别的机器上的反代访问时（比如东京的 Caddy 走 WireGuard 转到这里），把那台机器的地址写在这里。
  # 只有从这些地址来的请求才信 X-Forwarded-For（防爆破按真实来源 IP 锁）和 X-Forwarded-Proto
  # （Passkey 要认出 https）。不写的话所有访问者都会被当成反代那一台，一个人输错就锁住所有人。
  # 本机 127.0.0.1 / ::1 总是信任。设置页不改这一项，保存设置也不会抹掉它。
  # trusted_proxies: ["10.10.0.3"]

# 用 Palintropic 账户登录（OIDC）。这一段开着就总要登录，dashboard_auth.enabled 写 false 也一样。
# 上面的本地密码最好也设好：SSO 连不上时本地密码 / Passkey 是应急入口，登进来就是超级管理员，
# 12 小时后要重新登录。
# 档位由 Palintropic 发：panopticon:superadmin 什么都能做；panopticon:admin 只能看看板和历史，
# 进不了设置、看不到密钥、不能部署或移除 agent。没有这两档的账户登不进来。
# client 在 Palintropic 那边用 `bin/palid client` 建，redirect_uri 要跟那边登记的一字不差。
# issuer 要是 https（本机 localhost 开发除外）；discovery 里的各个地址必须跟 issuer 同源。
# 这一段只能手改 config.yaml，设置页不显示密钥，保存设置也不会动它。
sso:
  enabled: false
  issuer: "https://account.palintropic.cn/"
  client_id: ""
  client_secret: ""
  redirect_uri: "https://panopticon.palintropic.cn/auth/callback"
  # 退出时也退出 Palintropic，然后回到这里；不填就只退出看板
  post_logout_redirect_uri: "https://panopticon.palintropic.cn/login"
  # 看板会话多久后回 SSO 重新授权（档位在那时重新查一次，撤销最迟这么久后生效）。
  # Palintropic 的会话还在的话，重新授权不用再输密码。
  session_minutes: 60

# 网页终端（看板「终端」页）：在浏览器里开机器的 SSH 终端。只有用 Palintropic 账户登录的人能开，
# 每次打开都要在 Palintropic 用 Passkey 重新验证；能开哪几台由 Palintropic 的 ssh_hosts 分配，
# 这里的机器名（tokyo / shanghai / home）要跟那边一致。
# 登目标机用 Panopticon 现签的 5 分钟 SSH 证书（CA 私钥是同目录的 terminal_ca 文件，第一次用时生成）。
# 每台目标机要做一次：把 `python terminal_ca.py pubkey` 打印的 CA 公钥交给
#   sudo bash deploy/terminal-host-setup.sh mizuki "<CA 公钥>"
# 它最后打印的主机公钥填到下面的 host_key（钉死，对不上就不连）。
# 每次打开 / 关闭终端都推到飞书（用上面 notifications.feishu）和 slack_webhook。
terminal:
  enabled: false
  source_address: 10.10.0.1     # Panopticon 自己的 WireGuard 地址；连接从这里出发，证书也只认这个来源
  slack_webhook: ""             # Slack incoming webhook，不填就不推 Slack
  hosts:
    tokyo:
      label: 东京
      address: 10.10.0.3
      user: mizuki
      host_key: "ssh-ed25519 AAAA...（terminal-host-setup.sh 打印的那行）"

# 自建监控 agent（agent/metrics_agent.py，跑在各台服务器上）上报系统指标历史的接收端配置。
# agent 侧的 agent_config.yaml 里 shared_secret 要跟这里填的一致。
metrics_agent:
  enabled: false
  shared_secret: "生成一个随机字符串，agent 和 Panopticon 两边要一致"
  retention_days: 30   # 超过这么多天的历史数据会被自动清理
  # 设置页"一键部署 agent"用来生成 agent_config.yaml 里 report_url 的基础地址。
  # 不填的话会用你点"一键安装"那一刻浏览器访问设置页的地址来猜——如果你是通过
  # SSH 隧道 / 127.0.0.1 访问设置页、但部署目标是别的机器，这个猜测就是错的：
  # agent 会拿到一个只在它自己身上才有意义的地址，上报永远静默失败，也不会有任何报错提示。
  # 强烈建议只要会给"本机以外"的机器装 agent，就把这里填成 agent 那边能访问到 Panopticon 的
  # 真实地址（通常是 WireGuard 内网地址），比如 "http://10.10.0.1:1810"。
  report_url: ""

# 给 2702（Nightcord-Status）的 qingyuan 检测用的只读心跳接口：GET /api/agents/heartbeat，
# 请求头 X-Status-Token 要跟这里的 token 一致。只返回每台机器最后一次上报时间和在线判定，
# 不含 IP / 磁盘等细节。token 跟 metrics_agent.shared_secret 分开生成，不要复用。
status_api:
  enabled: false
  token: "生成一个随机字符串，2702 那边配置同一个值"

# 告警通知（机器离线 / CPU / 内存 / 磁盘超阈值时推送）
# 阈值适用于青源（自建 agent，见 metrics_agent 段）上报的机器。
notifications:
  # 同一个问题（比如"机器A的CPU告警"）只在刚触发时发一次，问题没解决之前不会重复推送；
  # 这个值只在"问题解决后又复发"时起作用——两次触发间隔小于它，就当是抖动，先不通知。
  cooldown_seconds: 600

  thresholds:
    cpu: 90    # CPU 使用率 %
    mem: 90    # 内存使用率 %
    disk: 85   # 磁盘使用率 %

  feishu:
    enabled: false
    # 飞书群 -> 设置 -> 群机器人 -> 添加"自定义机器人"，复制 Webhook 地址。
    # 推送的是卡片消息（含 @所有人），机器人要关闭"签名校验"，否则会发送失败。
    webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 465
    use_ssl: true          # 465 端口通常用 SSL；如用 587 端口把 use_ssl 改 false、use_tls 改 true
    use_tls: false
    username: "your_email@qq.com"
    password: "SMTP授权码（不是邮箱登录密码）"
    from: "your_email@qq.com"
    to:
      - "w_mutsumi@hotmail.com"

# 设置 → 主题 里选的颜色（总览曲线、一切正常的磁贴、底部状态栏），#rrggbb。
# 一般在设置页里点选就行，会自动写到这里；不写就全部用 25 时紫 #884499。
# 红色（需要关注）和黄色（接近阈值）是固定的，不在这里改。
# appearance:
#   tile: "#884499"
#   curve: "#ddaacc"
#   bar: "#8888cc"

# 设置 → 颜文字 里改的：哪台机器由哪个角色看（不写 = 按机器名自动分），以及改过的表情
# （[一切正常, 接近阈值, 离线或需要关注]，空字符串 = 用默认）。一般在设置页里改就行。
