<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 · Panopticon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/uwp.css">
<style>
  /* Plain page, no card (as PNS): app name as a pivot title, a Subheader, then fields.
     Column width 360 and its centring on wide screens are by eye. */
  .auth-shell{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:var(--group-gap) var(--page-margin)}
  .auth-panel{width:min(360px,100%);display:flex;flex-direction:column;gap:var(--gutter)}
  .auth-panel .pivot-title{padding:0}
  .auth-panel h1{margin:0 0 var(--gutter);font:var(--type-subheader)}
  .auth-panel form{display:flex;flex-direction:column}
  .auth-submit{align-self:flex-start;min-width:120px;margin-top:var(--gutter)}   /* min width by eye */
  .divider{display:flex;align-items:center;gap:var(--gutter);color:var(--SystemBaseMedium);font:var(--type-caption)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--SystemBaseLow)}
  #msg{min-height:20px}
  #msg.err{color:var(--warn)} #msg.ok{color:var(--SystemBaseMedium)}
</style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-panel">
    <div class="pivot-title">Panopticon</div>
    <h1>登录</h1>

    <button class="btn btn-accent" id="passkeyBtn" onclick="loginWithPasskey()">使用 Passkey 登录</button>

    <div class="divider">或者用密码</div>

    <form id="pwForm" onsubmit="loginWithPassword(event)">
      <label class="field">用户名<input type="text" id="username" autocomplete="username"></label>
      <label class="field">密码<input type="password" id="password" autocomplete="current-password"></label>
      <button class="btn auth-submit" type="submit">登录</button>
    </form>

    <div id="msg"></div>
  </div>
</div>

<script>
function showMsg(text, ok){
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = ok ? 'ok' : 'err';
}

function base64urlToBuffer(base64url){
  const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  const pad = base64.length % 4 ? '='.repeat(4 - base64.length % 4) : '';
  const raw = atob(base64 + pad);
  const buf = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) buf[i] = raw.charCodeAt(i);
  return buf.buffer;
}

function bufferToBase64url(buf){
  const bytes = new Uint8Array(buf);
  let str = '';
  for(const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function loginWithPassword(e){
  e.preventDefault();
  showMsg('登录中…', true);
  try{
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if(!res.ok){ showMsg(data.error || '登录失败', false); return; }
    location.href = '/';
  }catch(err){
    showMsg('登录失败：' + err, false);
  }
}

async function loginWithPasskey(){
  if(!window.PublicKeyCredential){
    showMsg('当前浏览器不支持 Passkey', false);
    return;
  }
  showMsg('等待 Passkey 验证…', true);
  try{
    const optRes = await fetch('/api/webauthn/login/options', {method: 'POST'});
    const options = await optRes.json();
    if(!optRes.ok){ showMsg(options.error || '获取登录选项失败', false); return; }

    options.challenge = base64urlToBuffer(options.challenge);
    if(options.allowCredentials){
      options.allowCredentials = options.allowCredentials.map(c => ({...c, id: base64urlToBuffer(c.id)}));
    }

    const assertion = await navigator.credentials.get({publicKey: options});

    const credential = {
      id: assertion.id,
      rawId: bufferToBase64url(assertion.rawId),
      type: assertion.type,
      response: {
        clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
        authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
        signature: bufferToBase64url(assertion.response.signature),
        userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null,
      },
      clientExtensionResults: assertion.getClientExtensionResults(),
    };

    const verifyRes = await fetch('/api/webauthn/login/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({credential}),
    });
    const result = await verifyRes.json();
    if(!verifyRes.ok){ showMsg(result.error || 'Passkey 验证失败', false); return; }
    location.href = '/';
  }catch(err){
    showMsg('Passkey 登录失败：' + err, false);
  }
}
</script>
</body>
</html>
